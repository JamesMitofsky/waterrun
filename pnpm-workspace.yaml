packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@tailwindcss/oxide": true
minimumReleaseAgeExclude:
  - expo-dev-client@57.0.8
  - expo-dev-launcher@57.0.8
  - expo-dev-menu@57.0.8
  - "@expo/cli@57.0.10"
  - "@expo/config-plugins@57.0.6"
  - "@expo/config@57.0.6"
  - "@expo/fingerprint@0.20.6"
  - "@expo/image-utils@0.11.4"
  - "@expo/metro-config@57.0.7"
  - "@expo/prebuild-config@57.0.9"
  - "@expo/require-utils@57.0.4"
  - "@expo/router-server@57.0.4"
  - babel-preset-expo@57.0.4
  - expo-asset@57.0.7
  - expo-constants@57.0.7
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7
  - expo-modules-jsi@57.0.4
  - expo@57.0.8
  - expo-linking@57.0.4
  - expo-location@57.0.6
  - expo-notifications@57.0.7
  - expo-router@57.0.8
  - expo-sharing@57.0.7
  - expo-splash-screen@57.0.5
  - expo-task-manager@57.0.6
  - expo-web-browser@57.0.2
# React Native libraries ship .d.ts files that import "react" while only
# peer-depending on it, so TypeScript finds React's types by walking up to an
# ancestor node_modules/@types. Hoisting the mobile app's own @types/react to
# the root makes that walk land on the copy the app compiles against, rather
# than on a stray root devDependency or whatever pnpm happens to hoist
# privately (which an existing install does not redo when that dependency
# disappears).
publicHoistPattern:
  - "@types/react"
